<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FALLING SUNS | Feature Film</title>
<meta name="description" content="FALLING SUNS — a dark, survive-the-night comedy set in Tijuana. A film by Eric Armando Ibarra.">
<meta property="og:title" content="FALLING SUNS | Feature Film">
<meta property="og:description" content="A film by Eric Armando Ibarra.">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Orbitron:wght@500;700&family=Pinyon+Script&family=Space+Mono:ital@0;1&display=swap" rel="stylesheet">
<style>
  /* ============ EDIT COLORS HERE ============ */
  :root{
    --neon:#ff2a1a;        /* main neon red */
    --ember:#ff7a1a;       /* orange glow */
    --gold:#ffb21a;        /* small caps text */
    --ink:#050303;         /* background black */
    --frame:#f3ece4;       /* slider frame color */
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--ink);color:#fff;font-family:'Space Mono',monospace;min-height:100%}
  body{overflow-x:hidden}

  /* ---------- background ---------- */
  .bg{position:fixed;inset:0;z-index:0;overflow:hidden}
  .bg canvas{position:absolute;inset:0;width:100%;height:100%;display:block;filter:blur(1.2px) saturate(1.15)}
  .bg video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:brightness(.6)}
  .bg::after{content:"";position:absolute;inset:0;
    background:linear-gradient(to bottom,rgba(5,3,3,.15),rgba(5,3,3,.25) 60%,rgba(5,3,3,.7));}
  .grain{position:fixed;inset:0;z-index:1;pointer-events:none;opacity:.12;mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    animation:grain 1s steps(4) infinite}
  @keyframes grain{25%{transform:translate(-2%,1%)}50%{transform:translate(1%,-2%)}75%{transform:translate(2%,2%)}}

  main{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;min-height:100vh;padding:12vh 4vw 0;gap:2.4vh}

  /* ---------- title ---------- */
  .title{line-height:0;margin:0;animation:flicker 7s infinite}
  .title img{display:block;width:min(760px,84vw);height:auto;
    filter:drop-shadow(0 0 18px rgba(255,70,20,.55)) drop-shadow(0 0 50px rgba(255,90,20,.3))}
  @keyframes flicker{0%,18%,22%,62%,64%,100%{opacity:1}20%,63%{opacity:.7}}
  .byline{font-size:.72rem;letter-spacing:.32em;color:var(--gold);text-transform:uppercase;text-align:center}

  .play{display:inline-flex;align-items:center;gap:.8rem;background:none;border:0;color:#fff;cursor:pointer;
    font-family:'Pinyon Script',cursive;font-size:1.9rem;text-shadow:0 0 10px var(--neon)}
  .play .tri{width:0;height:0;border-left:26px solid #fff;border-top:16px solid transparent;border-bottom:16px solid transparent;
    filter:drop-shadow(0 0 8px var(--neon));transition:transform .2s}
  .play:hover .tri{transform:scale(1.12)}
  .play[hidden]{display:none}

  /* ---------- deck slider ---------- */
  .deck{position:relative;width:min(1080px,80vw,calc((100vh - 12vh - 300px) * 16 / 9));aspect-ratio:16/9;border:6px solid var(--frame);
    box-shadow:0 0 0 1px rgba(0,0,0,.6),0 30px 80px rgba(0,0,0,.7),0 0 60px rgba(255,42,26,.25);
    background:#000;overflow:hidden;touch-action:pan-y}
  .track{display:flex;height:100%;transition:transform .6s cubic-bezier(.7,0,.2,1)}
  .slide{flex:0 0 100%;height:100%;position:relative;display:flex;align-items:center;justify-content:center}
  .slide video{width:100%;height:100%;object-fit:contain;display:block;background:#000}
  .slide img{width:100%;height:100%;object-fit:contain;display:block;user-select:none;-webkit-user-drag:none}
  .slide .missing{font-size:.8rem;letter-spacing:.2em;color:#777;text-align:center;line-height:2}
  .slide .missing b{display:block;font-family:'Anton';font-size:3rem;color:var(--neon);text-shadow:0 0 14px var(--neon);letter-spacing:0}
  .arrow{position:absolute;top:50%;transform:translateY(-50%);z-index:3;background:none;border:0;cursor:pointer;
    width:60px;height:90px;display:flex;align-items:center;justify-content:center;opacity:.75;transition:opacity .2s}
  .arrow:hover{opacity:1}
  .arrow svg{width:26px;height:26px;stroke:#fff;stroke-width:3;fill:none;filter:drop-shadow(0 0 6px rgba(0,0,0,.9))}
  .prev{left:0}.next{right:0}
  .counter{position:absolute;bottom:12px;right:16px;z-index:3;font-size:.7rem;letter-spacing:.2em;
    background:rgba(0,0,0,.55);padding:4px 10px;color:#ddd}
  .fs{position:absolute;bottom:10px;left:12px;z-index:3;background:rgba(0,0,0,.55);border:0;color:#ddd;cursor:pointer;
    font:inherit;font-size:.7rem;letter-spacing:.2em;padding:5px 10px}
  .deck:fullscreen{border:0;width:100vw;height:100vh;aspect-ratio:auto}

  .dots{display:flex;flex-wrap:wrap;justify-content:center;gap:7px;max-width:min(1200px,92vw)}
  .dots button{width:9px;height:9px;border-radius:50%;border:1px solid rgba(255,255,255,.5);background:transparent;cursor:pointer;padding:0}
  .dots button.on{background:var(--neon);border-color:var(--neon);box-shadow:0 0 8px var(--neon)}

  /* ---------- contact ---------- */
  footer{position:relative;z-index:2;text-align:center;padding:2vh 4vw 6vh;font-size:.75rem;letter-spacing:.14em;line-height:2.2;color:#cfc6bd}
  footer h2{font-family:'Pinyon Script',cursive;font-weight:400;font-size:2.4rem;letter-spacing:0;color:#fff;
    text-shadow:0 0 10px var(--neon),0 0 26px var(--neon);margin-bottom:.6rem}
  footer a{color:var(--gold);text-decoration:none}
  footer a:hover{text-shadow:0 0 8px var(--gold)}
  footer .row{display:flex;flex-wrap:wrap;gap:1.2rem 3rem;justify-content:center}
  footer .name{color:#fff;text-transform:uppercase}

  /* ---------- trailer modal ---------- */
  .modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center;padding:4vw}
  .modal.open{display:flex}
  .modal .frame{width:min(1200px,92vw);aspect-ratio:16/9;background:#000;box-shadow:0 0 60px rgba(255,42,26,.35)}
  .modal iframe,.modal video{width:100%;height:100%;border:0;display:block}
  .modal .close{position:absolute;top:18px;right:24px;background:none;border:0;color:#fff;font-size:2.2rem;cursor:pointer}

  /* ---------- music-video cuts ---------- */
  .shots{position:absolute;inset:0;z-index:0;overflow:hidden}
  .shots::after{content:"";position:absolute;inset:0;pointer-events:none;mix-blend-mode:overlay;
    background:linear-gradient(115deg,rgba(255,30,20,.45),rgba(255,80,20,.1) 45%,rgba(0,190,170,.35))}
  .shot{position:absolute;inset:0;opacity:0}
  .shot.on{opacity:1}
  .shot i{position:absolute;inset:-4%;background:center/cover no-repeat;transform-origin:var(--ox,50%) var(--oy,50%)}
  .shot.on i{animation:push var(--dur,6s) linear forwards}
  @keyframes push{from{transform:scale(1.04)}to{transform:scale(1.18)}}
  .shot .ch-m{filter:contrast(1.25) saturate(1.4) brightness(.62) sepia(.12)}
  .shot .ch-r,.shot .ch-c{opacity:0;mix-blend-mode:screen}
  .shot.glitch .ch-r{opacity:.55;margin-left:10px;filter:sepia(1) saturate(9) hue-rotate(-25deg) brightness(.6)}
  .shot.glitch .ch-c{opacity:.45;margin-left:-10px;filter:sepia(1) saturate(6) hue-rotate(140deg) brightness(.6)}
  .shot.glitch .ch-m{filter:contrast(1.5) saturate(1.8) brightness(.8) hue-rotate(-12deg);margin-top:-6px}
  .flash{position:absolute;inset:0;z-index:2;pointer-events:none;opacity:0}
  .flash.black{background:#000;opacity:1}
  .flash.red{background:#ff2a1a;opacity:.55;mix-blend-mode:screen}
  .bars{position:absolute;inset:0;z-index:2;pointer-events:none}
  .bars::before,.bars::after{content:"";position:absolute;left:0;right:0;height:0;background:#000;transition:height .35s cubic-bezier(.7,0,.2,1)}
  .bars::before{top:0}.bars::after{bottom:0}
  .bars.on::before,.bars.on::after{height:10vh}
  .bg::after{z-index:1}
  .bg.photo canvas{visibility:hidden}

  /* ---------- sound toggle ---------- */
  .sound{position:fixed;top:18px;right:22px;z-index:30;background:rgba(5,3,3,.5);border:1px solid rgba(255,90,40,.5);color:#eee;
    font:inherit;font-size:.65rem;letter-spacing:.25em;padding:8px 12px;cursor:pointer;display:none}
  .sound.ready{display:block}
  .sound:hover{box-shadow:0 0 14px rgba(255,42,26,.5)}
  .sound .bars{display:inline-flex;gap:2px;margin-right:8px;vertical-align:middle;height:10px;align-items:flex-end}
  .sound .bars i{width:2px;background:var(--neon);height:3px}
  .sound.on .bars i{animation:eq .9s infinite ease-in-out}
  .sound.on .bars i:nth-child(2){animation-delay:.2s}.sound.on .bars i:nth-child(3){animation-delay:.4s}
  @keyframes eq{50%{height:10px}}

  /* ---------- car cabin ---------- */
  .cabin{position:fixed;inset:0;z-index:1;pointer-events:none}
  body.locked .cabin, body.locked .dash{display:none}
  .cabin .roof{position:absolute;left:0;right:0;top:0;height:13vh;background:linear-gradient(#000 0%,rgba(0,0,0,.85) 45%,transparent)}
  .cabin .pillar{position:absolute;top:0;bottom:0;width:9vw;background:linear-gradient(90deg,#000 0%,#070405 60%,rgba(7,4,5,0));opacity:.92}
  .cabin .pillar.l{left:0;clip-path:polygon(0 0,100% 0,25% 100%,0 100%)}
  .cabin .pillar.r{right:0;transform:scaleX(-1);clip-path:polygon(0 0,100% 0,25% 100%,0 100%)}
  .mirror{position:fixed;z-index:3;top:1.6vh;left:50%;transform:translateX(-50%);width:clamp(170px,17vw,270px);aspect-ratio:3.2/1;
    border-radius:16px/45%;overflow:hidden;border:3px solid #0d0909;pointer-events:none;
    box-shadow:0 0 0 1px rgba(255,80,40,.3),0 0 28px rgba(255,40,20,.55),0 0 70px rgba(255,40,20,.25)}
  .mirror img{width:100%;height:100%;object-fit:cover;filter:saturate(1.2) brightness(.95)}
  .mirror::before{content:"";position:absolute;left:50%;top:-30px;width:8px;height:30px;background:#0d0909;transform:translateX(-50%)}
  body.locked .mirror{display:none}

  /* ---------- dashboard ---------- */
  .dash{position:relative;z-index:2;width:min(1320px,100vw);display:grid;grid-template-columns:1fr auto 1fr;align-items:end;gap:2vw;
    padding:2.4vh 4vw 2vh;margin-top:auto;
    background:radial-gradient(ellipse 60% 80% at 50% 0%,rgba(255,40,120,.10),transparent 70%),linear-gradient(#0e0809,#040203 70%);
    border-radius:50% 50% 0 0 / 34px 34px 0 0;border-top:1px solid rgba(255,61,139,.35);
    box-shadow:0 -18px 50px rgba(0,0,0,.85),inset 0 1px 0 rgba(255,255,255,.05)}
  .cluster{display:flex;align-items:center;gap:1.2vw;position:relative}
  .cluster.left{justify-content:flex-end}.cluster.right{justify-content:flex-start}
  .gauge{position:relative;width:clamp(130px,14vw,200px);aspect-ratio:1}
  .gauge svg{width:100%;height:100%;overflow:visible;filter:drop-shadow(0 0 4px rgba(255,61,139,.75))}
  .gauge::before{content:"";position:absolute;inset:4%;border-radius:50%;background:radial-gradient(circle,#120609 55%,#050203 75%);box-shadow:inset 0 0 18px #000,0 0 0 2px #1a0d10}
  .glabel{font:700 12px Orbitron,sans-serif}
  .gunit{font:500 7px Orbitron,sans-serif;letter-spacing:.15em;opacity:.8}
  .needle{stroke:#3fa9ff;stroke-width:3.5;stroke-linecap:round;filter:drop-shadow(0 0 4px #3fa9ff)}
  .hub{fill:#0b0607;stroke:#ff3d8b;stroke-width:1.5}
  .odo{position:absolute;left:50%;bottom:20%;transform:translateX(-50%);font:700 11px Orbitron,sans-serif;letter-spacing:.12em;color:#ff7be0;
    background:#24071f;border:1px solid #5a1450;padding:3px 7px;white-space:nowrap;text-shadow:0 0 6px #ff3dc8}
  .signal{background:none;border:0;cursor:pointer;padding:6px;line-height:0}
  .signal svg{width:30px;height:30px;fill:#39ff88;opacity:.28;transition:opacity .1s}
  .signal:hover svg{opacity:.6}
  .signal.blink svg{animation:sig .45s steps(1) 3}
  @keyframes sig{0%{opacity:1;filter:drop-shadow(0 0 8px #39ff88)}50%{opacity:.2;filter:none}}
  .radio{width:clamp(280px,27vw,400px);background:linear-gradient(#171113,#0a0607);border:1px solid #2b1a1d;border-radius:12px;padding:12px 14px;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 10px 30px rgba(0,0,0,.6)}
  .lcd{background:#041210;border:1px solid #0f3a32;border-radius:4px;padding:7px 10px;overflow:hidden;white-space:nowrap;
    font:500 12px Orbitron,sans-serif;letter-spacing:.14em;color:#5dffc9;text-shadow:0 0 6px #5dffc9}
  .lcd span{display:inline-block;padding-left:100%;animation:marq 12s linear infinite}
  @keyframes marq{to{transform:translateX(-100%)}}
  .radio-row{display:flex;align-items:center;justify-content:space-between;margin:12px 4px 10px}
  .radio-row .tag{font:500 9px Orbitron;letter-spacing:.2em;color:#9a7f84}
  .rplay{width:66px;height:66px;border-radius:50%;border:2px solid var(--neon);background:radial-gradient(circle,#2a0805,#0b0303);cursor:pointer;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:#fff;
    box-shadow:0 0 18px rgba(255,42,26,.6),inset 0 0 12px rgba(255,42,26,.35);animation:beckon 1.8s ease-in-out infinite}
  .rplay .ic{width:0;height:0;border-left:16px solid #fff;border-top:10px solid transparent;border-bottom:10px solid transparent;margin-left:4px;filter:drop-shadow(0 0 4px var(--neon))}
  .rplay.on .ic{width:14px;height:16px;border:0;margin:0;border-left:5px solid #fff;border-right:5px solid #fff}
  .rplay.on{animation:none;box-shadow:0 0 26px rgba(255,42,26,.85),inset 0 0 14px rgba(255,42,26,.5)}
  .rplay small{font:700 8px Orbitron;letter-spacing:.18em}
  @keyframes beckon{50%{box-shadow:0 0 34px rgba(255,42,26,.95),inset 0 0 16px rgba(255,42,26,.5);transform:scale(1.05)}}
  .eq{display:flex;gap:3px;align-items:flex-end;height:22px}
  .eq i{width:3px;height:4px;background:#5dffc9;box-shadow:0 0 4px #5dffc9}
  body.music-on .eq i{animation:eq .8s infinite ease-in-out}
  body.music-on .eq i:nth-child(2){animation-delay:.15s}body.music-on .eq i:nth-child(3){animation-delay:.3s}body.music-on .eq i:nth-child(4){animation-delay:.45s}
  .sp{border-radius:12px;overflow:hidden;height:80px;background:#0b0708}
  .sp iframe{display:block;border:0}
  .switches{display:flex;flex-direction:column;gap:10px}
  .sw{background:#0d0809;border:1px solid #2b1a1d;color:#cbb;cursor:pointer;font:500 9px Orbitron;letter-spacing:.2em;padding:8px 10px;text-align:left;display:flex;align-items:center;gap:8px}
  .sw::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--neon);box-shadow:0 0 6px var(--neon)}
  .sw:hover{border-color:rgba(255,61,139,.6)}
  .wheel{position:absolute;left:-15vw;bottom:-30vh;width:30vw;aspect-ratio:1;border-radius:50%;border:16px solid #070506;
    border-top-color:#0c1a19;box-shadow:inset 0 0 0 1px rgba(60,220,200,.18),0 -2px 14px rgba(60,220,200,.12);pointer-events:none;z-index:-1;opacity:.9}
  .dots,.counter,.deck .fs{display:none}
  @media (max-width:820px){
    .cabin .pillar,.wheel,.cluster.right .switches{display:none}
    .dash{grid-template-columns:1fr 1fr;grid-template-areas:"radio radio" "l r";border-radius:24px 24px 0 0}
    .radio{grid-area:radio;width:100%}.cluster.left{grid-area:l;justify-content:center}.cluster.right{grid-area:r;justify-content:center}
    .gauge{width:min(36vw,150px)}
    .deck{width:94vw}
    main{padding-top:10vh}
  }
  /* ---------- password gate ---------- */
  .gate{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.4vh;padding:6vw;text-align:center}
  .gate form{display:flex;flex-direction:column;align-items:center;gap:14px;margin-top:2vh}
  .gate input{background:rgba(5,3,3,.55);border:1px solid rgba(255,90,40,.6);color:#fff;font:inherit;font-size:.9rem;letter-spacing:.3em;
    text-align:center;padding:12px 18px;width:min(320px,80vw);outline:none;box-shadow:0 0 18px rgba(255,42,26,.25)}
  .gate input:focus{border-color:var(--neon);box-shadow:0 0 24px rgba(255,42,26,.55)}
  .gate button{background:none;border:0;color:#fff;cursor:pointer;font-family:'Pinyon Script',cursive;font-size:1.8rem;text-shadow:0 0 10px var(--neon)}
  .gate .err{min-height:1.2em;font-size:.7rem;letter-spacing:.2em;color:var(--gold)}
  .gate .note{font-size:.62rem;letter-spacing:.3em;color:#a99;text-transform:uppercase}
  body.locked main, body.locked footer{display:none}
  body:not(.locked) .gate{display:none}

  @media (max-width:640px){
    .deck{border-width:3px}
    .arrow{width:40px}
    .play{font-size:1.5rem}
    .dots{display:none}
  }
  @media (prefers-reduced-motion:reduce){.title,.grain{animation:none}.track{transition:none}}
</style>
</head>
<body class="locked">

<!-- Background: endless night drive (nightdrive.js). Optional real footage via BG_VIDEO. -->
<div class="bg" id="bg"><canvas id="drive"></canvas></div>
<div class="grain"></div>
<div class="cabin" aria-hidden="true"><div class="roof"></div><div class="pillar l"></div><div class="pillar r"></div></div>
<div class="mirror" aria-hidden="true"><img src="media/mirror.jpg" alt=""></div>
<button class="sound" id="soundBtn" aria-pressed="false"><span class="bars"><i></i><i></i><i></i></span><span id="soundLbl">SOUND OFF</span></button>

<section class="gate" id="gate" aria-label="Password required">
  <h1 class="title"><img src="media/title.png" alt="Falling Suns"></h1>
  <p class="byline">A film by Eric Armando Ibarra</p>
  <form id="gateForm" autocomplete="off">
    <label class="note" for="pw">Private — enter password</label>
    <input id="pw" type="password" autocomplete="current-password" autofocus aria-describedby="err">
    <button type="submit">Enter</button>
    <div class="err" id="err" role="alert"></div>
  </form>
</section>

<main>
  <button class="play" id="playBtn" hidden><span class="tri"></span>Play me</button>

  <section class="deck" id="deck" aria-label="Pitch deck" aria-roledescription="carousel">
    <div class="track" id="track"></div>
    <button class="arrow prev" id="prev" aria-label="Previous slide"><svg viewBox="0 0 24 24"><path d="M15 4 7 12l8 8"/></svg></button>
    <button class="arrow next" id="next" aria-label="Next slide"><svg viewBox="0 0 24 24"><path d="M9 4l8 8-8 8"/></svg></button>
    <button class="fs" id="fsBtn">⛶ FULL SCREEN</button>
    <div class="counter" id="counter">01 / 25</div>
  </section>
  <nav class="dots" id="dots" aria-label="Slide navigation"></nav>
  <section class="dash" aria-label="Dashboard">
    <div class="cluster left">
      <div class="wheel"></div>
      <button class="signal" id="sigL" aria-label="Previous slide"><svg viewBox="0 0 24 24"><path d="M2 12l9-8v5h11v6H11v5z"/></svg></button>
      <div class="gauge"><svg id="speedo" viewBox="0 0 200 200"></svg><div class="odo" id="odo">01 / 25</div></div>
    </div>
    <div class="radio" id="radio">
      <div class="lcd" id="radioLcd"><span>FM 87.9 &nbsp;·&nbsp; NOW PLAYING &nbsp;·&nbsp; KING'S BLVD 2 &nbsp;·&nbsp; FALLING SUNS &nbsp;·&nbsp; TIJUANA AFTER DARK</span></div>
      <div class="radio-row">
        <span class="tag">STEREO</span>
        <button class="rplay" id="radioPlay" aria-pressed="false" aria-label="Play the soundtrack"><span class="ic"></span><small id="radioPlayLbl">PLAY</small></button>
        <span class="eq" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
      </div>
      <div class="sp"><div id="spEmbed"></div></div>
    </div>
    <div class="cluster right">
      <div class="gauge"><svg id="tacho" viewBox="0 0 200 200"></svg></div>
      <button class="signal" id="sigR" aria-label="Next slide"><svg viewBox="0 0 24 24"><path d="M22 12l-9-8v5H2v6h11v5z"/></svg></button>
      <div class="switches"><button class="sw" id="swFull">FULL SCREEN</button><button class="sw" id="swContact">CONTACT</button></div>
    </div>
  </section>
</main>

<footer>
  <h2>Contact</h2>
  <div class="row">
    <div><span class="name">Eric Armando Ibarra</span><br><a href="mailto:eric@chulacreative.com">eric@chulacreative.com</a></div>
    <div><span class="name">Alexandria E. Martin</span><br><a href="mailto:alex@westwindowpicturehouse.com">alex@westwindowpicturehouse.com</a></div>
  </div>
</footer>

<div class="modal" id="modal" role="dialog" aria-label="Trailer">
  <button class="close" id="closeModal" aria-label="Close">×</button>
  <div class="frame" id="modalFrame"></div>
</div>

<script>
/* ================= EDIT THESE SETTINGS ================= */
const SLIDE_COUNT = 25;          // number of slides (encrypted as slides/1.bin, 2.bin, ...)
const VIDEO_SLIDES = [19, 20]; // slides that play as looping video (encrypted slides/N.vbin), e.g. [19, 20]
/* Encryption values — regenerate with: python3 tools/encrypt_slides.py <password> <folder-of-jpgs> */
const SALT   = 'BnVCBes1BJR8pUMRfJB/1A==';
const VERIFY = 'd09JnKR8xLtRT2cddvIP5jhwbGsX6LPlfrZLJe3cypv2pYlM9gyL5w==';
const ITER   = 250000;
const TRAILER_URL = '';          // paste a YouTube/Vimeo link or 'media/trailer.mp4' — leave '' to hide "Play me"
const SPOTIFY_TRACK = '7pQXGnceGhu1hRQkG5g7I7'; // King's Blvd 2 — Spotify mini player, bottom-left
window.SPOTIFY_TRACK = SPOTIFY_TRACK;
const MUSIC_URL   = ''; // soundtrack; starts when the password is entered. Leave the file out to hide the sound button.
const BG_VIDEO    = '';          // optional: 'media/bg.mp4' to use real footage instead of the animated night drive
/* ======================================================= */

const track = document.getElementById('track'), dots = document.getElementById('dots'),
      counter = document.getElementById('counter'), deck = document.getElementById('deck');
let i = 0;
const pad = n => String(n).padStart(2,'0');

for (let n = 1; n <= SLIDE_COUNT; n++) {
  const s = document.createElement('div');
  s.className = 'slide'; s.setAttribute('aria-label', `Slide ${n} of ${SLIDE_COUNT}`);
  const img = new Image();
  img.alt = `Falling Suns deck, slide ${n}`;
  img.decoding = 'async';
  s.appendChild(img); track.appendChild(s);
  const d = document.createElement('button');
  d.setAttribute('aria-label', `Go to slide ${n}`); d.onclick = () => go(n - 1);
  dots.appendChild(d);
}

function go(n) {
  i = (n + SLIDE_COUNT) % SLIDE_COUNT;
  track.style.transform = `translateX(-${i * 100}%)`;
  counter.textContent = `${pad(i + 1)} / ${pad(SLIDE_COUNT)}`;
  [...dots.children].forEach((d, k) => d.classList.toggle('on', k === i));
  if (typeof syncVideos === 'function') syncVideos();
  window.__slide = [i, SLIDE_COUNT]; window.dashSetSlide && window.dashSetSlide(i, SLIDE_COUNT);
}
document.getElementById('prev').onclick = () => go(i - 1);
document.getElementById('next').onclick = () => go(i + 1);
document.addEventListener('keydown', e => {
  if (document.getElementById('modal').classList.contains('open')) { if (e.key === 'Escape') closeModal(); return; }
  if (e.key === 'ArrowRight') go(i + 1);
  if (e.key === 'ArrowLeft') go(i - 1);
});
// swipe
let x0 = null;
deck.addEventListener('touchstart', e => x0 = e.touches[0].clientX, {passive:true});
deck.addEventListener('touchend', e => {
  if (x0 === null) return;
  const dx = e.changedTouches[0].clientX - x0;
  if (Math.abs(dx) > 40) go(i + (dx < 0 ? 1 : -1));
  x0 = null;
});
// fullscreen
document.getElementById('fsBtn').onclick = () => {
  if (document.fullscreenElement) document.exitFullscreen();
  else { try { const r=(deck.requestFullscreen || deck.webkitRequestFullscreen)?.call(deck); r && r.catch && r.catch(()=>{}); } catch(e){} }
};
go(0);

// ---------- password unlock (AES-GCM, key from PBKDF2) ----------
const b64 = x => Uint8Array.from(atob(x), c => c.charCodeAt(0));
async function deriveKey(pw) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name: 'PBKDF2', salt: b64(SALT), iterations: ITER, hash: 'SHA-256'},
    base, {name: 'AES-GCM', length: 256}, true, ['decrypt']);
}
const dec = (key, buf) => crypto.subtle.decrypt({name: 'AES-GCM', iv: buf.slice(0, 12)}, key, buf.slice(12));
async function loadSlides(key) {
  const order = [...Array(SLIDE_COUNT).keys()];
  for (const k of order) {
    try {
      const r = await fetch(`slides/${k + 1}.bin`);
      const plain = await dec(key, new Uint8Array(await r.arrayBuffer()));
      track.children[k].querySelector('img').src = URL.createObjectURL(new Blob([plain], {type: 'image/jpeg'}));
    } catch (e) { track.children[k].innerHTML = `<div class="missing"><b>${pad(k + 1)}</b>slide unavailable</div>`; }
  }
  for (const n of VIDEO_SLIDES) {             // swap stills for their video versions
    try {
      const r = await fetch(`slides/${n}.vbin`);
      const plain = await dec(key, new Uint8Array(await r.arrayBuffer()));
      const v = document.createElement('video');
      Object.assign(v, {muted: true, loop: true, playsInline: true, preload: 'auto'});
      v.setAttribute('playsinline', ''); v.setAttribute('muted', '');
      v.className = 'slide-video';
      v.src = URL.createObjectURL(new Blob([plain], {type: 'video/mp4'}));
      const slide = track.children[n - 1], img = slide.querySelector('img');
      if (img) v.poster = img.src;
      slide.replaceChildren(v);
      syncVideos();
    } catch (e) { /* keep the still if the video can't load */ }
  }
}
function syncVideos() {
  [...track.children].forEach((s, k) => { const v = s.querySelector('video'); if (!v) return; if (k === i) v.play().catch(() => {}); else { v.pause(); v.currentTime = 0; } });
}
async function unlock(key) {
  await dec(key, b64(VERIFY));            // throws if wrong password
  document.body.classList.remove('locked');
  window.dashUnlocked && window.dashUnlocked();
  try { sessionStorage.setItem('fs-key', btoa(String.fromCharCode(...new Uint8Array(await crypto.subtle.exportKey('raw', key))))); } catch (e) {}
  loadSlides(key);
}
// ---------- soundtrack ----------
const music = new Audio(); music.loop = true; music.preload = 'auto'; music.volume = 0;
const soundBtn = document.getElementById('soundBtn');
function setSound(on) {
  soundBtn.classList.toggle('on', on); soundBtn.setAttribute('aria-pressed', on);
  document.getElementById('soundLbl').textContent = on ? 'SOUND ON' : 'SOUND OFF';
  if (on) { music.play().then(() => { let v = 0; const f = setInterval(() => { v = Math.min(0.7, v + 0.05); music.volume = v; if (v >= 0.7) clearInterval(f); }, 120); }).catch(() => setSound(false)); }
  else music.pause();
}
if (MUSIC_URL) {
  music.src = MUSIC_URL;
  music.addEventListener('canplay', () => soundBtn.classList.add('ready'), {once: true});
  soundBtn.onclick = () => setSound(!soundBtn.classList.contains('on'));
}

document.getElementById('gateForm').addEventListener('submit', async e => {
  e.preventDefault();
  if (MUSIC_URL && music.src) music.play().then(() => music.pause()).catch(() => {}); // unlock audio on this tap
  const err = document.getElementById('err'); err.textContent = '…';
  try { await unlock(await deriveKey(document.getElementById('pw').value.trim())); if (soundBtn.classList.contains('ready')) setSound(true); }
  catch (x) { err.textContent = 'WRONG PASSWORD'; document.getElementById('pw').select(); }
});
(async () => {
  try {
    const saved = sessionStorage.getItem('fs-key');
    if (saved) await unlock(await crypto.subtle.importKey('raw', b64(saved), 'AES-GCM', true, ['decrypt']));
  } catch (e) {}
})();

// optional real-footage background (sits over the animated drive once loaded)
if (BG_VIDEO) {
  const v = document.createElement('video');
  Object.assign(v, {src: BG_VIDEO, autoplay: true, muted: true, loop: true, playsInline: true});
  v.setAttribute('playsinline', '');
  v.addEventListener('loadeddata', () => document.getElementById('bg').appendChild(v));
}

// trailer
const modal = document.getElementById('modal'), frame = document.getElementById('modalFrame');
function embed(url) {
  let m;
  if ((m = url.match(/(?:youtu\.be\/|v=|embed\/)([\w-]{11})/))) return `<iframe src="https://www.youtube.com/embed/${m[1]}?autoplay=1&rel=0" allow="autoplay; fullscreen" allowfullscreen></iframe>`;
  if ((m = url.match(/vimeo\.com\/(?:video\/)?(\d+)(?:\/(\w+))?/))) return `<iframe src="https://player.vimeo.com/video/${m[1]}?autoplay=1${m[2] ? '&h=' + m[2] : ''}" allow="autoplay; fullscreen" allowfullscreen></iframe>`;
  return `<video src="${url}" controls autoplay playsinline></video>`;
}
function closeModal() { modal.classList.remove('open'); frame.innerHTML = ''; }
if (TRAILER_URL) {
  const b = document.getElementById('playBtn'); b.hidden = false;
  b.onclick = () => { frame.innerHTML = embed(TRAILER_URL); modal.classList.add('open'); };
}
document.getElementById('closeModal').onclick = closeModal;
modal.addEventListener('click', e => { if (e.target === modal) closeModal(); });
</script>
<script src="nightdrive.js"></script>
<script src="bgcuts.js"></script>
<script src="dashboard.js"></script>
<script>window.__slide && window.dashSetSlide(window.__slide[0], window.__slide[1]);</script>
</body>
</html>
