    <rect x="22" y="34" width="20" height="24" rx="7" fill="url(#head)" stroke="#000" stroke-width="1"/>
    <rect x="25" y="37" width="6" height="12" rx="3" fill="#fff" opacity=".12"/>
    <circle cx="32" cy="53" r="2.2" fill="#222" stroke="#555" stroke-width=".6"/>
    <rect x="28.5" y="30" width="7" height="5" rx="1" fill="url(#ring)" stroke="#555" stroke-width=".5"/>
    <path d="M29 30 L29 4 L33 1 L35.5 4 L35.5 9 L33.5 11 L35.5 13 L35.5 17 L33.5 19 L35.5 21 L35.5 30 Z" fill="url(#blade)" stroke="#555" stroke-width=".6"/>
  </g>
</svg>
